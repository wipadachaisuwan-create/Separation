</head><body><header><div class="row"><div class="grow"><h1>🧪 Separation Science Quest</h1><div>ภารกิจพิชิตการแยกสารและการนำไปใช้ • วิทยาศาสตร์ ม.2 • ว 2.1 ม.2/1–3</div></div><button class="secondary" onclick="toggleLang()" id="langBtn">EN / ไทย</button></div></header><main><section class="card" id="intro"><h2>เริ่มภารกิจนักวิทยาศาสตร์</h2><p>เรียนรู้ ทดลอง และแก้ปัญหาการแยกสาร 5 วิธี ผ่านเกม 5 ด่าน รวม 100 คะแนน</p><div class="row"><input id="name" placeholder="ชื่อ–นามสกุล" class="grow"><input id="cls" placeholder="ชั้น เช่น ม.2/1"><input id="num" type="number" min="1" placeholder="เลขที่"><button onclick="start()">เริ่มเกม 🚀</button></div><p id="introErr" class="bad"></p></section><div id="app" class="hidden"><section class="card"><div class="row"><b id="student"></b><span class="pill" id="score">คะแนน 0/100</span><span class="pill" id="badge">เหรียญ 0 🏅</span></div><div class="progress"><div id="bar" style="width:0"></div></div><div class="tabs" id="tabs"></div></section><section class="card" id="content"></section></div></main><script>
const methods=[{id:'evap',th:'การระเหยแห้ง',en:'Evaporation',mix:'น้ำเกลือ',principle:'ทำให้ตัวทำละลายระเหยออก เหลือเกลือในจานระเหย ไม่เก็บน้ำกลับคืน',equipment:['จานระเหย','เครื่องให้ความร้อน','บีกเกอร์'],steps:['เทน้ำเกลือลงจานระเหย','ให้ความร้อนอย่างเหมาะสม','สังเกตเกลือที่เหลือ']},{id:'crystal',th:'การตกผลึก',en:'Crystallization',mix:'สารละลายสารส้มอิ่มตัว',principle:'เมื่อสารละลายอิ่มตัวเย็นลง ความสามารถในการละลายของสารส้มลดลง จึงเกิดผลึก',equipment:['บีกเกอร์','แท่งแก้วคน','ภาชนะตกผลึก'],steps:['เตรียมสารละลายสารส้มอิ่มตัวขณะอุ่น','ปล่อยให้เย็นอย่างช้า ๆ','สังเกตผลึกสารส้ม']},{id:'distill',th:'การกลั่นอย่างง่าย',en:'Simple Distillation',mix:'น้ำเกลือ',principle:'ให้น้ำระเหยเป็นไอแล้วผ่านเครื่องควบแน่น เก็บน้ำกลั่นได้ ส่วนเกลืออยู่ในขวดกลั่น',equipment:['ขวดกลั่น','เทอร์มอมิเตอร์','เครื่องควบแน่น','ภาชนะรับ'],steps:['ประกอบขวดกลั่นและเครื่องควบแน่น','ให้ความร้อนและให้น้ำหล่อเย็นไหล','เก็บน้ำที่ควบแน่น']},{id:'chrom',th:'โครมาโทกราฟีแบบกระดาษ',en:'Paper Chromatography',mix:'หมึกปากกาสีดำชนิดละลายน้ำ',principle:'สารสีมีความชอบต่อเฟสเคลื่อนที่และเฟสอยู่กับที่ต่างกัน จึงเคลื่อนที่ต่างระยะ โดย Rf = ระยะสาร/ระยะตัวทำละลาย',equipment:['กระดาษโครมาโทกราฟี','บีกเกอร์','ดินสอ'],steps:['ขีดเส้นเริ่มต้นด้วยดินสอและแต้มหมึก','วางกระดาษโดยให้จุดหมึกอยู่เหนือระดับตัวทำละลาย','วัดระยะสีและแนวหน้าตัวทำละลาย']},{id:'extract',th:'การสกัดด้วยตัวทำละลาย',en:'Solvent Extraction',mix:'ดอกอัญชัน',principle:'เลือกตัวทำละลายที่ละลายสารเป้าหมายได้ดี เช่น น้ำสกัดแอนโทไซยานินจากดอกอัญชัน',equipment:['บีกเกอร์','อุปกรณ์บด','กระดาษกรอง'],steps:['บดหรือฉีกวัสดุพืช','เติมตัวทำละลายที่เหมาะสมและแช่','กรองแยกกากพืชออก']}];
const quiz=[['ต้องการเก็บเกลือจากน้ำเกลือโดยไม่เก็บน้ำ ควรใช้วิธีใด',['การกลั่นอย่างง่าย','การระเหยแห้ง','โครมาโทกราฟี','การสกัด'],1,'น้ำระเหยออกไป เหลือเกลืออยู่'],['การผลิตน้ำกลั่นจากน้ำเกลืออาศัยหลักการใด',['การระเหยและควบแน่น','การกรอง','การตกตะกอน','การใช้แม่เหล็ก'],0,'ไอน้ำถูกทำให้เย็นจนควบแน่นเป็นน้ำกลั่น'],['การแยกสีหมึกบนกระดาษอาศัยหลักการใด',['จุดหลอมเหลว','ความหนาแน่นเพียงอย่างเดียว','การกระจายตัวระหว่างสองเฟส','ขนาดภาชนะ'],2,'สีแต่ละชนิดมีความสามารถในการเคลื่อนที่บนกระดาษต่างกัน'],['ต้องการผลึกสารส้มจากสารละลายอิ่มตัว ควรใช้วิธีใด',['การตกผลึก','การกรองอย่างเดียว','แม่เหล็ก','การร่อน'],0,'ทำให้สารละลายเย็นลงหรือระเหยตัวทำละลายบางส่วนเพื่อให้เกิดผลึก'],['ต้องการสีจากดอกอัญชันสำหรับอาหาร ควรใช้วิธีใด',['แม่เหล็ก','กลั่นลำดับส่วน','ร่อน','สกัดด้วยน้ำ'],3,'แอนโทไซยานินละลายในน้ำได้']];
let state={stage:0,unlock:0,points:[0,0,0,0,0],done:[false,false,false,false,false],method:0,explored:[],lab:0,placed:[],completedLabs:[],records:[],matched:[],responses:{},vars:{},lang:'th'};const $=id=>document.getElementById(id);function save(){localStorage.setItem('separationQuestV2',JSON.stringify({state,name:$('name').value,cls:$('cls').value,num:$('num').value}))}function start(){if(!$('name').value.trim()||!$('cls').value.trim()||!$('num').value){$('introErr').textContent='กรุณากรอกชื่อ ชั้น และเลขที่ให้ครบ';return} $('intro').classList.add('hidden');$('app').classList.remove('hidden');render();save()}function render(){let total=state.points.reduce((a,b)=>a+b,0);$('student').textContent=`${$('name').value} | ${$('cls').value} เลขที่ ${$('num').value}`;$('score').textContent=`คะแนน ${total}/100`;$('badge').textContent=`เหรียญ ${state.done.filter(Boolean).length} 🏅`;$('bar').style.width=state.done.filter(Boolean).length*20+'%';$('tabs').innerHTML=['Explorer','Virtual Lab','Simulator','Detective','Challenge','🏆 เกียรติบัตร'].map((t,i)=>`<button class="${state.stage===i?'active':''}" ${i>state.unlock?'disabled':''} onclick="go(${i})">${i<5?'ด่าน '+(i+1)+' · ':''}${t} ${state.done[i]?'✓':''}</button>`).join('');let c=$('content');if(state.stage===0)stage1(c);if(state.stage===1)stage2(c);if(state.stage===2)stage3(c);if(state.stage===3)stage4(c);if(state.stage===4)stage5(c);if(state.stage===5)certificate(c);save()}function go(i){if(i<=state.unlock){state.stage=i;render()}}function finish(i,p){state.points[i]=Math.max(state.points[i],p);state.done[i]=true;state.unlock=Math.max(state.unlock,i+1);render();$('content').insertAdjacentHTML('afterbegin',`<p class="good"><b>🎉 ผ่านด่าน ${i+1}! ได้ ${state.points[i]}/20 คะแนน</b> <button onclick="go(${i+1})">ไปด่านถัดไป →</button></p>`)}function methodCards(on){return `<div class="grid">${methods.map((m,i)=>`<div class="tile ${state.method===i?'selected':''}" onclick="${on}(${i})"><b>${m.th}</b><br><small>${m.en}</small><p>${m.mix}</p></div>`).join('')}</div>`}function chooseMethod(i){state.method=i;state.explored=[...new Set([...state.explored,i])];render()}function stage1(c){let m=methods[state.method];c.innerHTML=`<h2>🧪 ด่าน 1: Separation Explorer</h2><p>สำรวจการแยกสารทั้ง 5 วิธี แล้วตอบคำถามเพื่อปลดล็อก</p>${methodCards('chooseMethod')}<div class="stage"><h3>${m.th}</h3>${visual(state.method,60)}<p>${m.principle}</p></div><p>สำรวจแล้ว ${state.explored.length}/5 วิธี</p><div class="drop">คำถาม: หากต้องการ <b>เก็บน้ำบริสุทธิ์จากน้ำเกลือ</b> ควรใช้วิธีใด?<select id="exAnswer"><option value="">เลือกวิธี</option>${methods.map((x,i)=>`<option value="${i}">${x.th}</option>`).join('')}</select><button onclick="checkExplorer()">ตรวจคำตอบ</button><p id="exFeed"></p></div>`}function checkExplorer(){if(state.explored.length<5){$('exFeed').textContent='สำรวจให้ครบทั้ง 5 วิธีก่อน';return}if(+$('exAnswer').value===2){finish(0,20)}else $('exFeed').textContent='ลองใหม่: วิธีใดสามารถควบแน่นไอเพื่อเก็บน้ำกลับมาได้?'}
function stage2(c){let m=methods[state.lab];c.innerHTML=`<h2>🔬 ด่าน 2: Virtual Separation Laboratory</h2><p>เลือกการทดลอง แล้วลากอุปกรณ์ลงพื้นที่ประกอบ (หรือแตะอุปกรณ์บนมือถือ)</p><div class="row"><select onchange="setLab(this.value)">${methods.map((x,i)=>`<option value="${i}" ${i===state.lab?'selected':''}>${x.th}</option>`).join('')}</select><span class="pill">สำเร็จ ${state.completedLabs.length}/5 การทดลอง</span></div><div class="grid"><div><h3>อุปกรณ์</h3>${[...new Set([...m.equipment,'แม่เหล็ก','ตะแกรง'])].map(x=>`<span class="equip" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x}')" onclick="addEquip('${x}')">${x}</span>`).join('')}<div class="drop" ondragover="event.preventDefault()" ondrop="event.preventDefault();addEquip(event.dataTransfer.getData('text/plain'))"><b>พื้นที่ประกอบอุปกรณ์</b><p>${state.placed.map(x=>`<span class="pill">${x}</span>`).join('')||'ลากหรือแตะอุปกรณ์เพื่อเพิ่ม'}</p></div><button class="secondary" onclick="state.placed=[];render()">ล้างพื้นที่</button></div><div><h3>ลำดับขั้นตอน</h3>${m.steps.map((x,i)=>`<p>${i+1}. ${x}</p>`).join('')}<button onclick="checkLab()">ตรวจชุดทดลองและบันทึกผล</button><p id="labFeed"></p></div></div><div class="stage">${visual(state.lab,65)}<p>${m.principle}</p></div><p><small>การทดลองนี้เป็นแบบจำลอง ไม่ใช้แทนการปฏิบัติจริงในห้องปฏิบัติการ</small></p>`}function setLab(i){state.lab=+i;state.placed=[];render()}function addEquip(x){if(!state.placed.includes(x))state.placed.push(x);render()}function checkLab(){let m=methods[state.lab];if(m.equipment.every(x=>state.placed.includes(x))){state.completedLabs=[...new Set([...state.completedLabs,state.lab])];if(state.completedLabs.length===5)finish(1,20);else{let next=methods.findIndex((x,i)=>!state.completedLabs.includes(i));state.lab=next;state.placed=[];render()}}else $('labFeed').textContent='ยังขาดอุปกรณ์ที่จำเป็น ลองตรวจรายการอีกครั้ง'}
function defaultVars(){return {temp:85,time:20,vol:100,conc:50,solvent:'water',front:8,ink:'black',plant:'butterfly'}}function controls(){let v=state.vars;let m=state.method;let specs=m===0?[['temp','อุณหภูมิ (°C)',25,110,1],['time','เวลา (นาที)',0,60,1],['vol','ปริมาณน้ำเกลือ (mL)',30,200,10],['conc','ความเข้มข้น (%)',5,25,1]]:m===1?[['temp','อุณหภูมิสุดท้าย (°C)',10,75,1],['time','เวลาพักให้เย็น (นาที)',0,90,1],['conc','ความอิ่มตัวเริ่มต้น (%)',50,100,5]]:m===2?[['temp','อุณหภูมิ (°C)',25,110,1],['time','เวลา (นาที)',0,60,1],['vol','ปริมาณน้ำเกลือ (mL)',30,200,10]]:m===3?[['front','ระยะตัวทำละลาย (cm)',1,12,.5],['time','เวลา (นาที)',1,30,1]]:[['vol','ปริมาณตัวทำละลาย (mL)',10,200,5],['time','เวลา (นาที)',1,60,1],['temp','อุณหภูมิ (°C)',20,70,1]];let html=specs.map(([id,label,min,max,step])=>`<div class="control"><label>${label}: <b id="val_${id}">${v[id]}</b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v[id]}" oninput="state.vars.${id}=+this.value;updateSim()"></div>`).join('');if(m===3)html+=`<div class="control">หมึก <select onchange="state.vars.ink=this.value;updateSim()"><option value="black">หมึกดำละลายน้ำ</option><option value="blue">หมึกน้ำเงินละลายน้ำ</option></select></div><div class="control">ตัวทำละลาย <select onchange="state.vars.solvent=this.value;updateSim()"><option value="water">น้ำ</option><option value="ethanol">เอทานอล (จำลอง)</option></select></div>`;if(m===4)html+=`<div class="control">พืช <select onchange="state.vars.plant=this.value;updateSim()"><option value="butterfly">อัญชัน</option><option value="pandan">ใบเตย</option><option value="turmeric">ขมิ้น</option></select></div><div class="control">ตัวทำละลาย <select onchange="state.vars.solvent=this.value;updateSim()"><option value="water">น้ำ</option><option value="ethanol">เอทานอล (จำลอง)</option></select></div>`;return html}function calculate(){let v=state.vars,m=state.method,amt=0,label='',note='';if(m===0){amt=Math.min(100,Math.max(0,(v.temp-30)/70)*v.time/35*100*100/v.vol);label='สัดส่วนน้ำที่ระเหย';note=`เหลือน้ำประมาณ ${(v.vol*(1-amt/100)).toFixed(1)} mL (แบบจำลอง); เกลือไม่ระเหยตามน้ำ`;}if(m===1){amt=Math.max(0,Math.min(100,(75-v.temp)/65*(v.conc/100)*Math.min(1,v.time/35)*100));label='แนวโน้มการเกิดผลึก';note='การลดอุณหภูมิและเวลาที่เพียงพอช่วยให้สารส้มตกผลึก (ค่าประมาณเชิงการสอน)'}if(m===2){amt=Math.min(100,Math.max(0,(v.temp-75)/25)*v.time/45*100*100/v.vol);label='สัดส่วนน้ำกลั่นที่เก็บได้';note=v.temp<95?'อุณหภูมิยังไม่เอื้อต่อการกลั่นน้ำอย่างมีประสิทธิภาพในแบบจำลอง':'ไอน้ำผ่านเครื่องควบแน่น เก็บน้ำกลั่นได้ โดยเกลือยังอยู่ในขวด';}if(m===3){amt=v.front/12*100;label='ระยะทางแนวหน้าตัวทำละลาย';note=`จุดสีตัวอย่าง: ${(v.front*.35).toFixed(2)}, ${(v.front*.64).toFixed(2)}, ${(v.front*.82).toFixed(2)} cm | Rf = 0.35, 0.64, 0.82 (ค่าเชิงสมมติ)`;}if(m===4){let eff=v.plant==='turmeric'?(v.solvent==='ethanol'?1:.35):v.plant==='pandan'?(v.solvent==='ethanol'?.9:.4):(v.solvent==='water'?1:.65);amt=Math.min(100,eff*(1-Math.exp(-v.time/16))*Math.min(1,v.vol/75)*100);label='ระดับการสกัดสีโดยประมาณ';note='ตัวทำละลายที่เหมาะกับสารสีช่วยให้สกัดได้มากขึ้น; ไม่ใช่ค่าผลผลิตจริง';}return {amt:Math.round(amt),label,note}}const scenarios=[
{title:'ภารกิจโรงเกลือ: ผลิตเกลือจากน้ำทะเล',goal:'ทดลองระเหยน้ำเกลือโดยปรับอุณหภูมิและเวลา เพื่อเปรียบเทียบปริมาณน้ำที่ระเหย โดยต้องการเก็บเกลือไว้',question:'เมื่อเพิ่มอุณหภูมิโดยคงเวลาและปริมาตรเท่าเดิม ปริมาณน้ำที่ระเหยเปลี่ยนอย่างไร?',hint:'ตั้งปริมาตร 100 mL และความเข้มข้น 10% แล้วเปรียบเทียบอุณหภูมิ 60, 85 และ 105 °C ที่เวลา 30 นาที',variable:'temp'},
{title:'ภารกิจผลึกสารส้ม: นักออกแบบผลึก',goal:'ศึกษาผลของอุณหภูมิสุดท้ายต่อแนวโน้มการเกิดผลึกจากสารละลายสารส้มที่เตรียมให้อิ่มตัว',question:'เมื่อทำให้สารละลายอิ่มตัวเย็นลงมากขึ้น แนวโน้มการเกิดผลึกเป็นอย่างไร?',hint:'ตั้งเวลา 60 นาที ความอิ่มตัวเริ่มต้น 100% แล้วเปรียบเทียบอุณหภูมิ 60, 35 และ 15 °C',variable:'temp'},
{title:'ภารกิจน้ำสะอาด: ผลิตน้ำกลั่น',goal:'ใช้การระเหยและควบแน่นเพื่อเก็บน้ำจากน้ำเกลือ และศึกษาผลของอุณหภูมิที่มีต่อปริมาณน้ำกลั่น',question:'เหตุใดการกลั่นจึงเก็บน้ำกลับมาได้ แต่การระเหยแห้งแบบเปิดเก็บไม่ได้?',hint:'ตั้งน้ำเกลือ 100 mL เวลา 45 นาที แล้วเปรียบเทียบอุณหภูมิ 80, 95 และ 105 °C',variable:'temp'},
{title:'ภารกิจนักสืบหมึก: ตามหาสีที่ซ่อนอยู่',goal:'แยกองค์ประกอบหมึกด้วยกระดาษโครมาโทกราฟี และคำนวณค่า Rf ของจุดสีจากระยะทางที่เคลื่อนที่',question:'ถ้าระยะทางของตัวทำละลายเพิ่มขึ้น ค่า Rf ของสีเดิมควรเปลี่ยนหรือไม่ เมื่อสภาวะคงเดิม?',hint:'เลือกหมึกดำและน้ำ แล้วเปรียบเทียบระยะทางแนวหน้าตัวทำละลาย 4, 8 และ 12 cm',variable:'front'},
{title:'ภารกิจสีธรรมชาติ: สกัดสีจากดอกอัญชัน',goal:'เลือกตัวทำละลายและปรับเวลาสกัด เพื่อศึกษาปริมาณสีที่สกัดได้จากพืช',question:'เมื่อเพิ่มเวลาสกัดโดยคงชนิดและปริมาตรตัวทำละลาย ผลการสกัดเปลี่ยนอย่างไร?',hint:'เลือกอัญชัน ใช้น้ำ 100 mL อุณหภูมิ 30 °C แล้วเปรียบเทียบเวลา 5, 20 และ 50 นาที',variable:'time'}];
function scenarioRecords(){return state.records.filter(r=>r.method===methods[state.method].th&&r.scenario===state.method)}
function stage3(c){
if(!state.vars.temp)state.vars=defaultVars();
let sc=scenarios[state.method], rec=scenarioRecords();
c.innerHTML=`<h2>⚗️ ด่าน 3: Separation Simulator</h2><p>เลือกสถานการณ์ ทดลองตามโจทย์ เปลี่ยนตัวแปรต้นทีละชนิด และบันทึกผลพร้อมข้อสังเกตอย่างน้อย 3 ครั้งในสถานการณ์เดียวกัน</p>
<label><b>เลือกภารกิจสถานการณ์</b></label><select onchange="state.method=+this.value;state.vars=defaultVars();render()">${methods.map((m,i)=>`<option value="${i}" ${i===state.method?'selected':''}>${i+1}. ${scenarios[i].title}</option>`).join('')}</select>
<div class="drop" style="margin:14px 0;background:linear-gradient(120deg,#e8f8ff,#fff8e9);border-left:5px solid #0a91ad"><h3>🎯 ${sc.title}</h3><p><b>สถานการณ์:</b> ${sc.goal}</p><p><b>ขั้นตอนที่แนะนำ:</b> ${sc.hint}</p><p><b>คำถามชวนคิด:</b> ${sc.question}</p><p><small>ตัวแปรต้นที่ให้เปลี่ยน: ${sc.variable==='temp'?'อุณหภูมิ':sc.variable==='front'?'ระยะทางแนวหน้าตัวทำละลาย':'เวลา'} • ควบคุมตัวแปรอื่นให้คงที่</small></p></div>
<div class="grid"><div><h3>1. ตั้งค่าการทดลอง</h3>${controls()}<label><b>2. บันทึกสิ่งที่สังเกต</b></label><textarea id="observation" rows="3" placeholder="เช่น เมื่อเพิ่มอุณหภูมิ น้ำระเหยมากขึ้น เพราะ..."></textarea><p><button onclick="record()">💾 บันทึกผลการทดลองครั้งนี้</button></p><p id="recordFeedback"></p></div><div class="stage" id="simView"></div></div>
<div id="simResult"></div><h3>📋 3. ตารางบันทึกและเปรียบเทียบผล</h3><p>สถานการณ์นี้บันทึกแล้ว <b>${rec.length}</b>/3 ครั้ง (สามารถทดลองเพิ่มเติมได้)</p><div style="overflow:auto"><table border="1" cellpadding="8" style="border-collapse:collapse;width:100%" id="recordTable"></table></div><canvas id="chart" width="640" height="200" style="max-width:100%"></canvas>
<div class="drop"><h3>🧠 4. สรุปผลการทดลอง</h3><p>${sc.question}</p><textarea id="conclusion" rows="3" placeholder="สรุปความสัมพันธ์ระหว่างตัวแปรต้นกับผลที่สังเกต และอธิบายหลักการทางวิทยาศาสตร์">${state.conclusions?.[state.method]||''}</textarea><p><button class="secondary" onclick="saveConclusion()">💾 บันทึกข้อสรุป</button></p><p id="conclusionFeedback"></p></div>
<div><button onclick="submitScenario()" ${rec.length<3?'disabled':''}>ตรวจบันทึกและส่งภารกิจ (20 คะแนน)</button></div><p><small>ผลจำลองเป็นค่าประมาณเพื่อการเรียนรู้ ไม่ใช่ข้อมูลทดลองจริง; ตัวแปรที่ไม่ได้ระบุในโจทย์ควรรักษาให้คงที่</small></p>`;
updateSim();drawRecords();
}
function saveConclusion(){state.conclusions=state.conclusions||{};state.conclusions[state.method]=($('conclusion')?.value||'').trim();save();$('conclusionFeedback').textContent='บันทึกข้อสรุปแล้ว'}
function submitScenario(){
saveConclusion();let r=scenarioRecords();
if(r.length<3){alert('ต้องบันทึกผลอย่างน้อย 3 ครั้ง');return}
if(new Set(r.map(x=>x.value)).size<2){alert('กรุณาปรับตัวแปรต้นให้ต่างกันอย่างน้อย 2 ค่า');return}
if((state.conclusions[state.method]||'').length<15){alert('กรุณาเขียนข้อสรุปอย่างน้อย 15 ตัวอักษร');return}
finish(2,20);
}
function updateSim(){if(state.stage!==2)return;for(let id of ['temp','time','vol','conc','front'])if($('val_'+id))$('val_'+id).textContent=state.vars[id];let r=calculate();$('simView').innerHTML=visual(state.method,r.amt)+`<h3>${r.label}: ${r.amt}%</h3>`;$('simResult').innerHTML=`<p class="pill">${r.note}</p><p>${methods[state.method].principle}</p>`}function record(){let obs=($('observation')?.value||'').trim();if(obs.length<8){$('recordFeedback').textContent='กรุณาเขียนสิ่งที่สังเกตอย่างน้อย 8 ตัวอักษร';return}let r=calculate(),v=state.vars,sc=scenarios[state.method];state.records.push({method:methods[state.method].th,scenario:state.method,vars:JSON.stringify(v),value:v[sc.variable],variable:sc.variable,observation:obs,result:r.amt});render()}
function drawRecords(){let rows=scenarioRecords(),t=$('recordTable');t.innerHTML='<tr><th>ครั้ง</th><th>ตัวแปรต้น</th><th>ค่าตัวแปร</th><th>ผล (%)</th><th>สิ่งที่สังเกต</th></tr>'+rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.variable==='temp'?'อุณหภูมิ':r.variable==='front'?'ระยะทาง':'เวลา'}</td><td>${r.value}</td><td>${r.result}</td><td>${r.observation.replace(/</g,'&lt;')}</td></tr>`).join('');let cv=$('chart'),ctx=cv.getContext('2d');ctx.clearRect(0,0,640,200);ctx.fillStyle='#143c56';ctx.fillText('ผลการทดลองในสถานการณ์นี้ (%)',15,20);rows.slice(-10).forEach((r,i)=>{ctx.fillStyle='#12a2a0';ctx.fillRect(35+i*58,175-r.result*1.25,30,r.result*1.25);ctx.fillStyle='#173747';ctx.fillText(String(r.result),35+i*58,170-r.result*1.25);ctx.fillText(String(r.value),35+i*58,190)})}
function stage4(c){c.innerHTML=`<h2>🕵️ ด่าน 4: Separation Detective</h2><p>เลือกวิธีที่เหมาะสมกับเป้าหมายแต่ละสถานการณ์</p>${missions.map((x,i)=>`<div class="drop"><b>${i+1}. ${x[0]}</b><div class="row"><select id="match${i}" ${state.matched.includes(i)?'disabled':''}><option value="">เลือกวิธี</option>${methods.map((m,j)=>`<option value="${j}">${m.th}</option>`).join('')}</select><button ${state.matched.includes(i)?'disabled':''} onclick="match(${i})">ตรวจ</button><span id="matchFeed${i}" class="${state.matched.includes(i)?'good':''}">${state.matched.includes(i)?'✓ ถูกต้อง':''}</span></div></div>`).join('')}<p>สำเร็จ ${state.matched.length}/5</p>`}function match(i){let v=$('match'+i).value;if(v==='')return;if(+v===missions[i][1]){state.matched.push(i);if(state.matched.length===5)finish(3,20);else render()}else $('matchFeed'+i).textContent='ยังไม่ถูก ลองคิดถึงสารที่ต้องการเก็บแล้วเลือกใหม่'}function stage5(c){c.innerHTML=`<h2>🏆 ด่าน 5: Separation Challenge</h2><p>แบบทดสอบ 5 ข้อ ข้อละ 4 คะแนน</p>${quiz.map((q,i)=>`<div class="drop"><b>${i+1}. ${q[0]}</b><div class="answers">${q[1].map((a,j)=>`<button class="${state.responses[i]===j?'chosen':''}" onclick="answer(${i},${j})">${'กขคง'[j]}. ${a}</button>`).join('')}</div></div>`).join('')}<button onclick="grade()" ${Object.keys(state.responses).length<5?'disabled':''}>ส่งคำตอบและดูเฉลย</button><div id="gradeFeedback"></div>`}function answer(i,j){state.responses[i]=j;render()}function grade(){let score=quiz.reduce((s,q,i)=>s+(state.responses[i]===q[2]?4:0),0);finish(4,score);$('content').insertAdjacentHTML('afterbegin',`<div class="card"><h3>ผลการทดสอบ ${score}/20 คะแนน</h3>${quiz.map((q,i)=>`<p><b>ข้อ ${i+1}: ${state.responses[i]===q[2]?'✓ ถูก':'✗ ผิด'}</b> เฉลย ${'กขคง'[q[2]]}. ${q[1][q[2]]}<br>${q[3]}</p>`).join('')}</div>`)}function certificate(c){let score=state.points.reduce((a,b)=>a+b,0);c.innerHTML=`<div class="certificate"><h2>🏅 Certificate of Achievement</h2><h1>Separation Science Quest</h1><h2>ภารกิจพิชิตการแยกสารและการนำไปใช้</h2><p>ขอมอบเกียรติบัตรฉบับนี้ให้แก่</p><h1>${escapeHtml($('name').value)}</h1><p>ชั้น ${escapeHtml($('cls').value)} เลขที่ ${escapeHtml($('num').value)}</p><p>เพื่อแสดงว่าได้เข้าร่วมและผ่านกิจกรรมการเรียนรู้ครบทั้ง 5 ด่าน</p><h2>คะแนนรวม ${score} / 100 คะแนน</h2><p>วันที่ ${new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})}</p><small>วิทยาศาสตร์ ม.2 • มาตรฐาน ว 2.1</small></div><p class="no-print"><button onclick="window.print()">🖨️ พิมพ์เกียรติบัตร / บันทึก PDF</button> <button class="secondary" onclick="exportResults()">ส่งออกผลคะแนน CSV</button></p>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportResults(){let vals=[$('name').value,$('cls').value,$('num').value,...state.points,state.points.reduce((a,b)=>a+b,0)];let csv='\ufeff'+['ชื่อ','ชั้น','เลขที่','ด่าน1','ด่าน2','ด่าน3','ด่าน4','ด่าน5','รวม'].join(',')+'\n'+vals.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='separation_scores.csv';a.click();URL.revokeObjectURL(a.href)}function visual(i,p){

const uid='lab3d'+i, water=195-p*1.1;

<linearGradient id="${uid}glass" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".85"/><stop offset=".22" stop-color="#b9e7f7" stop-opacity=".26"/><stop offset=".76" stop-color="#e7faff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient>

<filter id="${uid}shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>`;

}else if(i===2){
art=`<rect x="45" y="228" width="145" height="13" rx="6" fill="url(#${uid}steel)"/><path d="M75 112V207Q75 227 100 227H147Q173 227 173 207V112Z" fill="url(#${uid}glass)" stroke="#8fb7ca" stroke-width="4"/><path d="M79 166H169V204Q169 223 145 223H103Q79 223 79 204Z" fill="url(#${uid}liquid)" opacity=".85"/><path d="M124 113V56H280V96H391V203" stroke="#4d738d" stroke-width="21" fill="none" stroke-linejoin="round"/><path d="M124 113V56H280V96H391V203" stroke="url(#${uid}glass)" stroke-width="13" fill="none" stroke-linejoin="round"/><rect x="228" y="35" width="106" height="82" rx="17" fill="url(#${uid}glass)" stroke="url(#${uid}steel)" stroke-width="9"/><path d="M236 45l90 60m0 -60l-90 60" stroke="#68c4f0" stroke-width="3" opacity=".7"/><path d="M370 202h65v35h-65z" fill="url(#${uid}glass)" stroke="#7da5b9" stroke-width="4"/><rect x="374" y="${237-p*.3}" width="57" height="${p*.3}" fill="#63c6ee" opacity=".8"/><path d="M94 243h60" stroke="#f6a34a" stroke-width="8"/><text x="125" y="267" text-anchor="middle" font-size="13">น้ำเกลือ</text><text x="404" y="267" text-anchor="middle" font-size="13">น้ำกลั่น</text>`;
}else if(i===3){
let front=218-p*1.65;
art=`<path d="M125 49V230Q125 246 145 246H356Q376 246 376 230V49" fill="url(#${uid}glass)" stroke="#7ca4b9" stroke-width="5"/><rect x="165" y="23" width="170" height="207" rx="4" fill="#fffdf0" stroke="#b7a995" stroke-width="3"/><rect x="168" y="${front}" width="164" height="${218-front}" fill="#b8e6f8" opacity=".35"/><path d="M165 218H335" stroke="#8a7a6d" stroke-width="2" stroke-dasharray="5 5"/><path d="M165 ${front}H335" stroke="#1386ad" stroke-width="2" stroke-dasharray="5 5"/><circle cx="248" cy="${218-p*.55}" r="13" fill="#e85176" opacity=".8"/><circle cx="248" cy="${218-p*1.02}" r="12" fill="#eab23c" opacity=".8"/><circle cx="248" cy="${218-p*1.35}" r="11" fill="#356cc8" opacity=".8"/><path d="M175 33v160" stroke="#fff" stroke-width="9" opacity=".6"/><text x="345" y="28" font-size="12" fill="#31566a">แนวหน้าตัวทำละลาย</text><text x="250" y="282" text-anchor="middle" font-size="13" fill="#22475d">สารสีเคลื่อนที่ได้ต่างระยะ</text>`;
}else{
art=`<path d="M145 55V225Q145 244 168 244H333Q355 244 355 225V55" fill="url(#${uid}glass)" stroke="#81aec3" stroke-width="5"/><path d="M150 ${210-p*.9}H350V220Q350 240 330 240H170Q150 240 150 220Z" fill="url(#${uid}purple)" opacity="${.25+p/160}"/><ellipse cx="250" cy="${210-p*.9}" rx="100" ry="12" fill="#b6a5ec" opacity=".7"/><g transform="translate(245 113)"><path d="M0 0Q-75 -55 -55 -82Q-10 -82 0 -22Q10 -82 55 -82Q75 -55 0 0Z" fill="#6254bb" stroke="#c8bafa" stroke-width="4"/><path d="M0 -15V45" stroke="#477c59" stroke-width="6"/></g>${Array.from({length:12},(_,k)=>`<circle cx="${180+(k*29)%135}" cy="${170+(k*17)%52}" r="${2+k%4}" fill="#a5a2ff" opacity="${p/120}"/>`).join('')}<path d="M161 62v150" stroke="#fff" stroke-width="10" opacity=".5"/><text x="250" y="282" text-anchor="middle" font-size="13" fill="#22475d">สารสีละลายออกจากพืช</text>`;
}
return `<svg viewBox="0 0 500 300" role="img" aria-label="${methods[i].th} ภาพจำลองสามมิติแบบมีแสงเงา">${defs}${base}${art}</svg>`;

function toggleLang(){state.lang=state.lang==='th'?'en':'th';$('langBtn').textContent=state.lang==='th'?'EN / ไทย':'ไทย / EN';alert(state.lang==='en'?'English support: scientific method names and stage titles are bilingual. Full activity instructions remain in Thai.':'เปลี่ยนเป็นภาษาไทยแล้ว')};let stored=localStorage.getItem('separationQuestV2');if(stored){try{let s=JSON.parse(stored);state={...state,...s.state};$('name').value=s.name||'';$('cls').value=s.cls||'';$('num').value=s.num||'';if(s.name&&s.cls&&s.num)start()}catch(e){}}
